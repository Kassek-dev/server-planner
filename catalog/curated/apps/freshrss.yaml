id: freshrss
name: FreshRSS
description: { en: "Fast, self-hosted RSS and Atom feed aggregator." }
categories: [productivity, news]
website: "https://freshrss.org"
repository: "https://github.com/FreshRSS/FreshRSS"
license: AGPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: freshrss
      role: app
      image: freshrss/freshrss
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 80, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8082, containerPort: 80, protocol: tcp }]
      volumes:
        [
          {
            name: data,
            containerPath: /var/www/FreshRSS/data,
            purpose: data,
            defaultSizeBytes: 1 GB,
          },
        ]
requirements:
  min: { cpu: 0.1, memoryBytes: 64 MiB, diskBytes: 500 MiB }
  recommended: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 1 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-80
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 80
    purpose: web-ui
    required: true
  - id: feeds
    direction: outbound
    peer: { kind: internet }
    protocol: tcp
    port: 443
    purpose: metadata-fetch
    required: true
flows:
  - id: freshrss.open-ui
    name: { en: Open FreshRSS }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: FreshRSS }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
