id: linkding
name: linkding
description: { en: Minimal bookmark manager. }
categories: [productivity]
repository: "https://github.com/sissbruecker/linkding"
license: MIT
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: linkding
      role: app
      image: sissbruecker/linkding
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 9090, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 9090, containerPort: 9090, protocol: tcp }]
      volumes:
        [{ name: data, containerPath: /etc/linkding/data, purpose: data, defaultSizeBytes: 1 GB }]
requirements:
  min: { cpu: 0.1, memoryBytes: 64 MiB, diskBytes: 200 MiB }
  recommended: { cpu: 0.25, memoryBytes: 128 MiB, diskBytes: 500 MiB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-9090
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 9090
    purpose: web-ui
    required: true
flows:
  - id: linkding.open-ui
    name: { en: Open linkding }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: linkding }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
