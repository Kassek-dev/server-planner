id: stirling-pdf
name: Stirling-PDF
description: { en: "Local web toolbox for merging, splitting, converting and OCR of PDFs." }
categories: [productivity, documents]
website: "https://www.stirlingpdf.com"
repository: "https://github.com/Stirling-Tools/Stirling-PDF"
license: MIT
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: stirling-pdf
      role: app
      image: stirlingtools/stirling-pdf
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 8080, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8080, containerPort: 8080, protocol: tcp }]
      volumes:
        [{ name: config, containerPath: /configs, purpose: config, defaultSizeBytes: 50 MiB }]
requirements:
  min: { cpu: 0.5, memoryBytes: 512 MiB, diskBytes: 2 GB }
  recommended: { cpu: 1, memoryBytes: 1 GiB, diskBytes: 3 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-8080
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 8080
    purpose: web-ui
    required: true
flows:
  - id: stirling-pdf.open-ui
    name: { en: Open Stirling-PDF }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Stirling-PDF }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
