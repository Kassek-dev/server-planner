id: dockge
name: Dockge
description: { en: Reactive manager for docker compose stacks. }
categories: [management]
repository: "https://github.com/louislam/dockge"
license: MIT
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: dockge
      role: app
      image: louislam/dockge
      defaultTag: "1"
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 5001, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 5001, containerPort: 5001, protocol: tcp }]
      volumes:
        - { name: data, containerPath: /app/data, purpose: data, defaultSizeBytes: 100 MiB }
        - { name: stacks, containerPath: /opt/stacks, purpose: config, defaultSizeBytes: 1 GB }
requirements:
  min: { cpu: 0.1, memoryBytes: 64 MiB, diskBytes: 200 MiB }
  recommended: { cpu: 0.25, memoryBytes: 256 MiB, diskBytes: 500 MiB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-5001
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 5001
    purpose: web-ui
    required: true
flows:
  - id: dockge.open-ui
    name: { en: Open Dockge }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Dockge }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
