id: postgres
name: PostgreSQL
description: { en: Relational database used by many self-hosted apps. }
categories: [database]
website: "https://www.postgresql.org"
license: PostgreSQL
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: postgres
      role: database
      image: postgres
      defaultTag: "16"
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 5432, protocol: tcp, purpose: postgresql }]
      defaultPortMappings: [{ hostPort: 5432, containerPort: 5432, protocol: tcp }]
      volumes:
        - name: pgdata
          containerPath: /var/lib/postgresql/data
          purpose: data
          defaultSizeBytes: 10 GB
requirements:
  min: { cpu: 0.25, memoryBytes: 256 MiB, diskBytes: 1 GB }
  recommended: { cpu: 1, memoryBytes: 1 GiB, diskBytes: 10 GB }
dependencies: []
provides: [postgresql]
trafficPatterns:
  - id: postgresql-tcp-5432
    direction: inbound
    peer: { kind: dependency, capability: postgresql }
    protocol: tcp
    port: 5432
    purpose: postgresql
    required: true
flows:
  - id: postgres.query
    name: { en: App runs a query }
    roles:
      - key: client
        name: { en: App }
        selector: { kind: dependency, capability: postgresql }
        userPicks: true
      - { key: server, name: { en: PostgreSQL }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, port: 5432 }]
