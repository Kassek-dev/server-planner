id: code-server
name: code-server
description: { en: "VS Code in the browser, running on your server." }
categories: [development]
repository: "https://github.com/coder/code-server"
license: MIT
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: code-server
      role: app
      image: lscr.io/linuxserver/code-server
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 8443, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8443, containerPort: 8443, protocol: tcp }]
      volumes: [{ name: config, containerPath: /config, purpose: config, defaultSizeBytes: 5 GB }]
requirements:
  min: { cpu: 1, memoryBytes: 1 GiB, diskBytes: 5 GB }
  recommended: { cpu: 2, memoryBytes: 2 GiB, diskBytes: 10 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-8443
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 8443
    purpose: web-ui
    required: true
  - id: extensions
    direction: outbound
    peer: { kind: internet }
    protocol: tcp
    port: 443
    purpose: update-check
    required: false
flows:
  - id: code-server.open-ui
    name: { en: Open code-server }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: code-server }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
