id: joplin-server
name: Joplin Server
description: { en: Sync server for the Joplin note-taking apps. }
categories: [documents]
website: "https://joplinapp.org"
repository: "https://github.com/laurent22/joplin"
license: AGPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: stack
  components:
    - key: app
      name: joplin-server
      role: app
      image: joplin/server
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 22300, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 22300, containerPort: 22300, protocol: tcp }]
      volumes: []
    - key: db
      name: postgres
      role: database
      image: postgres
      defaultTag: "16"
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 5432, protocol: tcp, purpose: postgresql }]
      volumes:
        - {
            name: pgdata,
            containerPath: /var/lib/postgresql/data,
            purpose: data,
            defaultSizeBytes: 5 GB,
          }
requirements:
  min: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 1 GB }
  recommended: { cpu: 1, memoryBytes: 512 MiB, diskBytes: 10 GB }
dependencies: [{ capability: postgresql, optional: false, providedByComponent: db }]
provides: []
trafficPatterns:
  - id: web-ui-tcp-22300
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 22300
    purpose: web-ui
    required: true
  - id: db-postgresql
    direction: outbound
    peer: { kind: self-component, key: db }
    protocol: tcp
    port: 5432
    purpose: postgresql
    required: true
flows:
  - id: joplin-server.sync
    name: { en: Joplin app syncs notes }
    roles:
      - { key: client, name: { en: Joplin app }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Joplin Server }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, port: 22300, resolveDns: true }]
