id: glances
name: Glances
description: { en: Cross-platform system monitoring with a web UI and an API for dashboards. }
categories: [monitoring]
website: "https://nicolargo.github.io/glances/"
repository: "https://github.com/nicolargo/glances"
license: LGPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: glances
      role: app
      image: nicolargo/glances
      defaultTag: latest-full
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 61208, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 61208, containerPort: 61208, protocol: tcp }]
      volumes: []
requirements:
  min: { cpu: 0.1, memoryBytes: 64 MiB, diskBytes: 100 MiB }
  recommended: { cpu: 0.25, memoryBytes: 128 MiB, diskBytes: 200 MiB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-61208
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 61208
    purpose: web-ui
    required: true
flows:
  - id: glances.open-ui
    name: { en: Open Glances }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Glances }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
