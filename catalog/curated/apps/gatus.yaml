id: gatus
name: Gatus
description:
  { en: "Developer-oriented health dashboard with HTTP, DNS, ICMP and TCP checks and alerts." }
categories: [monitoring]
website: "https://gatus.io"
repository: "https://github.com/TwiN/gatus"
license: Apache-2.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: gatus
      role: app
      image: twinproduction/gatus
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 8080, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8083, containerPort: 8080, protocol: tcp }]
      volumes:
        - { name: config, containerPath: /config, purpose: config, defaultSizeBytes: 10 MiB }
        - { name: data, containerPath: /data, purpose: data, defaultSizeBytes: 1 GB }
requirements:
  min: { cpu: 0.05, memoryBytes: 32 MiB, diskBytes: 200 MiB }
  recommended: { cpu: 0.25, memoryBytes: 128 MiB, diskBytes: 1 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-8080
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 8080
    purpose: web-ui
    required: true
  - id: checks
    direction: outbound
    peer: { kind: dependency, capability: web-backend }
    protocol: tcp
    port: 443
    purpose: health-check
    required: false
flows:
  - id: gatus.open-ui
    name: { en: Open Gatus }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Gatus }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
