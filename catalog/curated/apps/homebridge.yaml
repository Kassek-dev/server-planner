id: homebridge
name: Homebridge
description: { en: Brings non-HomeKit devices to Apple Home. }
categories: [home-automation]
website: "https://homebridge.io"
repository: "https://github.com/homebridge/homebridge"
license: Apache-2.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: homebridge
      role: app
      image: homebridge/homebridge
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 8581, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8581, containerPort: 8581, protocol: tcp }]
      volumes: [{ name: data, containerPath: /homebridge, purpose: data, defaultSizeBytes: 1 GB }]
requirements:
  min: { cpu: 0.25, memoryBytes: 128 MiB, diskBytes: 500 MiB }
  recommended: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 1 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-8581
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 8581
    purpose: web-ui
    required: true
  - id: devices
    direction: outbound
    peer: { kind: device-kind, deviceKind: client, clientType: iot }
    protocol: tcp
    port: 80
    purpose: device-polling
    required: true
flows:
  - id: homebridge.open-ui
    name: { en: Open Homebridge }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Homebridge }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
