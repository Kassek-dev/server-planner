id: vikunja
name: Vikunja
description: { en: "To-do and project management with lists, kanban and Gantt views." }
categories: [productivity]
website: "https://vikunja.io"
repository: "https://github.com/go-vikunja/vikunja"
license: AGPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: vikunja
      role: app
      image: vikunja/vikunja
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 3456, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 3456, containerPort: 3456, protocol: tcp }]
      volumes:
        - { name: files, containerPath: /app/vikunja/files, purpose: data, defaultSizeBytes: 2 GB }
        - { name: db, containerPath: /db, purpose: data, defaultSizeBytes: 200 MiB }
requirements:
  min: { cpu: 0.1, memoryBytes: 128 MiB, diskBytes: 500 MiB }
  recommended: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 2 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-3456
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 3456
    purpose: web-ui
    required: true
flows:
  - id: vikunja.open-ui
    name: { en: Open Vikunja }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Vikunja }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
