id: redis
name: Redis
description: { en: In-memory key-value store used as cache and message broker. }
categories: [database]
website: "https://redis.io"
license: BSD-3-Clause
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: redis
      role: cache
      image: redis
      defaultTag: "7"
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 6379, protocol: tcp, purpose: redis }]
      defaultPortMappings: [{ hostPort: 6379, containerPort: 6379, protocol: tcp }]
      volumes: [{ name: data, containerPath: /data, purpose: data, defaultSizeBytes: 1 GB }]
requirements:
  min: { cpu: 0.1, memoryBytes: 64 MiB, diskBytes: 100 MiB }
  recommended: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 1 GB }
dependencies: []
provides: [redis]
trafficPatterns:
  - id: redis-tcp-6379
    direction: inbound
    peer: { kind: dependency, capability: redis }
    protocol: tcp
    port: 6379
    purpose: redis
    required: true
flows:
  - id: redis.query
    name: { en: App runs a query }
    roles:
      - key: client
        name: { en: App }
        selector: { kind: dependency, capability: redis }
        userPicks: true
      - { key: server, name: { en: Redis }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, port: 6379 }]
