id: headscale
name: Headscale
description: { en: Self-hosted implementation of the Tailscale coordination server. }
categories: [vpn, networking]
repository: "https://github.com/juanfont/headscale"
license: BSD-3-Clause
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: headscale
      role: app
      image: headscale/headscale
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners:
        [
          { port: 8080, protocol: tcp, purpose: api },
          { port: 9090, protocol: tcp, purpose: metrics },
        ]
      defaultPortMappings: [{ hostPort: 8080, containerPort: 8080, protocol: tcp }]
      volumes:
        - { name: config, containerPath: /etc/headscale, purpose: config, defaultSizeBytes: 10 MiB }
        - {
            name: data,
            containerPath: /var/lib/headscale,
            purpose: data,
            defaultSizeBytes: 200 MiB,
          }
requirements:
  min: { cpu: 0.1, memoryBytes: 64 MiB, diskBytes: 200 MiB }
  recommended: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 500 MiB }
dependencies: []
provides: [vpn-control]
trafficPatterns:
  - id: api-tcp-8080
    direction: inbound
    peer: { kind: internet }
    protocol: tcp
    port: 8080
    purpose: api
    required: true
  - id: metrics-tcp-9090
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 9090
    purpose: metrics
    required: false
flows:
  - id: headscale.open-ui
    name: { en: Open Headscale }
    roles:
      - key: client
        name: { en: Tailscale client }
        selector: { kind: lan-clients }
        userPicks: true
      - { key: server, name: { en: Headscale }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: api, resolveDns: true }]
