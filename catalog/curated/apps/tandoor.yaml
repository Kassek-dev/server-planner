id: tandoor
name: Tandoor Recipes
description: { en: Recipe manager with meal plans and shopping lists. }
categories: [home, productivity]
website: "https://tandoor.dev"
repository: "https://github.com/TandoorRecipes/recipes"
license: AGPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: stack
  components:
    - key: app
      name: tandoor
      role: app
      image: vabene1111/recipes
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 80, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8093, containerPort: 80, protocol: tcp }]
      volumes:
        - {
            name: static,
            containerPath: /opt/recipes/staticfiles,
            purpose: data,
            defaultSizeBytes: 1 GB,
          }
        - {
            name: media,
            containerPath: /opt/recipes/mediafiles,
            purpose: media,
            defaultSizeBytes: 5 GB,
          }
    - key: db
      name: postgres
      role: database
      image: postgres
      defaultTag: "16"
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 5432, protocol: tcp, purpose: postgresql }]
      volumes:
        - {
            name: pgdata,
            containerPath: /var/lib/postgresql/data,
            purpose: data,
            defaultSizeBytes: 1 GB,
          }
requirements:
  min: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 2 GB }
  recommended: { cpu: 1, memoryBytes: 512 MiB, diskBytes: 5 GB }
dependencies: [{ capability: postgresql, optional: false, providedByComponent: db }]
provides: []
trafficPatterns:
  - id: web-ui-tcp-80
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 80
    purpose: web-ui
    required: true
  - id: db-postgresql
    direction: outbound
    peer: { kind: self-component, key: db }
    protocol: tcp
    port: 5432
    purpose: postgresql
    required: true
flows:
  - id: tandoor.open-ui
    name: { en: Open Tandoor Recipes }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Tandoor Recipes }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
