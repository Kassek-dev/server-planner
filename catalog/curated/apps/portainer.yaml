id: portainer
name: Portainer CE
description: { en: "Web UI to manage Docker hosts, stacks and containers." }
categories: [management]
website: "https://www.portainer.io"
repository: "https://github.com/portainer/portainer"
license: Zlib
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: portainer
      role: app
      image: portainer/portainer-ce
      defaultTag: lts
      arch: [amd64, arm64]
      platform: linux
      listeners:
        - { port: 9443, protocol: tcp, purpose: web-ui }
        - { port: 8000, protocol: tcp, purpose: edge-agent }
      defaultPortMappings:
        - { hostPort: 9443, containerPort: 9443, protocol: tcp }
        - { hostPort: 8000, containerPort: 8000, protocol: tcp }
      volumes: [{ name: data, containerPath: /data, purpose: data, defaultSizeBytes: 1 GB }]
requirements:
  min: { cpu: 0.1, memoryBytes: 128 MiB, diskBytes: 1 GB }
  recommended: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 1 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-9443
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 9443
    purpose: web-ui
    required: true
  - id: edge-agent-tcp-8000
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 8000
    purpose: edge-agent
    required: true
flows:
  - id: portainer.open-ui
    name: { en: Open Portainer CE }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Portainer CE }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
