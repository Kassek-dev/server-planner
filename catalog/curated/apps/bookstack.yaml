id: bookstack
name: BookStack
description: { en: "Wiki organized as shelves, books and pages." }
categories: [productivity, documentation]
website: "https://www.bookstackapp.com"
repository: "https://github.com/BookStackApp/BookStack"
license: MIT
source: [curated]
confidence: curated
deployment:
  kind: stack
  components:
    - key: app
      name: bookstack
      role: app
      image: lscr.io/linuxserver/bookstack
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 80, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 6875, containerPort: 80, protocol: tcp }]
      volumes: [{ name: config, containerPath: /config, purpose: config, defaultSizeBytes: 1 GB }]
    - key: db
      name: mariadb
      role: database
      image: lscr.io/linuxserver/mariadb
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 3306, protocol: tcp, purpose: mysql }]
      volumes: [{ name: db, containerPath: /config, purpose: data, defaultSizeBytes: 2 GB }]
requirements:
  min: { cpu: 0.5, memoryBytes: 512 MiB, diskBytes: 2 GB }
  recommended: { cpu: 1, memoryBytes: 1 GiB, diskBytes: 5 GB }
dependencies: [{ capability: mysql, optional: false, providedByComponent: db }]
provides: []
trafficPatterns:
  - id: web-ui-tcp-80
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 80
    purpose: web-ui
    required: true
  - id: db-mysql
    direction: outbound
    peer: { kind: self-component, key: db }
    protocol: tcp
    port: 3306
    purpose: mysql
    required: true
flows:
  - id: bookstack.open-ui
    name: { en: Open BookStack }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: BookStack }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
