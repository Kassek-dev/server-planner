id: authelia
name: Authelia
description: { en: Single sign-on and two-factor portal for reverse proxies (forward auth). }
categories: [security]
website: "https://www.authelia.com"
repository: "https://github.com/authelia/authelia"
license: Apache-2.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: authelia
      role: app
      image: authelia/authelia
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 9091, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 9091, containerPort: 9091, protocol: tcp }]
      volumes: [{ name: config, containerPath: /config, purpose: config, defaultSizeBytes: 50 MiB }]
requirements:
  min: { cpu: 0.1, memoryBytes: 64 MiB, diskBytes: 200 MiB }
  recommended: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 500 MiB }
dependencies: [{ capability: redis, optional: true }]
provides: [sso]
trafficPatterns:
  - id: web-ui-tcp-9091
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 9091
    purpose: web-ui
    required: true
flows:
  - id: authelia.open-ui
    name: { en: Open Authelia }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Authelia }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
