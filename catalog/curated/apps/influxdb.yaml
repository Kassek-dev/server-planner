id: influxdb
name: InfluxDB
description: { en: "Time-series database for metrics, sensors and events." }
categories: [database, monitoring]
website: "https://www.influxdata.com"
repository: "https://github.com/influxdata/influxdb"
license: MIT
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: influxdb
      role: database
      image: influxdb
      defaultTag: "2"
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 8086, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8086, containerPort: 8086, protocol: tcp }]
      volumes:
        [{ name: data, containerPath: /var/lib/influxdb2, purpose: data, defaultSizeBytes: 10 GB }]
requirements:
  min: { cpu: 0.5, memoryBytes: 512 MiB, diskBytes: 5 GB }
  recommended: { cpu: 1, memoryBytes: 1 GiB, diskBytes: 20 GB }
dependencies: []
provides: [timeseries-db]
trafficPatterns:
  - id: web-ui-tcp-8086
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 8086
    purpose: web-ui
    required: true
flows:
  - id: influxdb.open-ui
    name: { en: Open InfluxDB }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: InfluxDB }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
