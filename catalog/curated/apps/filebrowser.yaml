id: filebrowser
name: File Browser
description: { en: Web file manager for a directory on your server. }
categories: [files]
website: "https://filebrowser.org"
repository: "https://github.com/filebrowser/filebrowser"
license: Apache-2.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: filebrowser
      role: app
      image: filebrowser/filebrowser
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 80, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8085, containerPort: 80, protocol: tcp }]
      volumes:
        - { name: srv, containerPath: /srv, purpose: data, defaultSizeBytes: 100 GB }
        - { name: database, containerPath: /database, purpose: config, defaultSizeBytes: 50 MiB }
requirements:
  min: { cpu: 0.1, memoryBytes: 64 MiB, diskBytes: 100 MiB }
  recommended: { cpu: 0.25, memoryBytes: 128 MiB, diskBytes: 200 MiB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-80
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 80
    purpose: web-ui
    required: true
flows:
  - id: filebrowser.open-ui
    name: { en: Open File Browser }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: File Browser }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
