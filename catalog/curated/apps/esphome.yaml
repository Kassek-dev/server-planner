id: esphome
name: ESPHome
description: { en: Builds and flashes firmware for ESP32/ESP8266 devices from YAML. }
categories: [home-automation]
website: "https://esphome.io"
repository: "https://github.com/esphome/esphome"
license: MIT
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: esphome
      role: app
      image: ghcr.io/esphome/esphome
      defaultTag: stable
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 6052, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 6052, containerPort: 6052, protocol: tcp }]
      volumes: [{ name: config, containerPath: /config, purpose: config, defaultSizeBytes: 2 GB }]
requirements:
  min: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 2 GB }
  recommended: { cpu: 2, memoryBytes: 1 GiB, diskBytes: 5 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-6052
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 6052
    purpose: web-ui
    required: true
  - id: ota
    direction: outbound
    peer: { kind: device-kind, deviceKind: client, clientType: iot }
    protocol: tcp
    port: 3232
    purpose: ota-update
    required: false
flows:
  - id: esphome.open-ui
    name: { en: Open ESPHome }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: ESPHome }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
