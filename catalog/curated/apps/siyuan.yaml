id: siyuan
name: SiYuan
description: { en: Block-based personal knowledge management with bidirectional links. }
categories: [documents]
website: "https://b3log.org/siyuan"
repository: "https://github.com/siyuan-note/siyuan"
license: AGPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: siyuan
      role: app
      image: b3log/siyuan
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 6806, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 6806, containerPort: 6806, protocol: tcp }]
      volumes:
        [
          {
            name: workspace,
            containerPath: /siyuan/workspace,
            purpose: data,
            defaultSizeBytes: 2 GB,
          },
        ]
requirements:
  min: { cpu: 0.25, memoryBytes: 256 MiB, diskBytes: 1 GB }
  recommended: { cpu: 1, memoryBytes: 512 MiB, diskBytes: 5 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-6806
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 6806
    purpose: web-ui
    required: true
flows:
  - id: siyuan.open-ui
    name: { en: Open SiYuan }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: SiYuan }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
