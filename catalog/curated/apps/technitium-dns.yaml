id: technitium-dns
name: Technitium DNS Server
description: { en: "Recursive and authoritative DNS server with ad blocking, DoH/DoT and DHCP." }
categories: [dns, networking]
website: "https://technitium.com/dns/"
repository: "https://github.com/TechnitiumSoftware/DnsServer"
license: GPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: technitium
      role: dns
      image: technitium/dns-server
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners:
        - { port: 5380, protocol: tcp, purpose: web-ui }
        - { port: 53, protocol: udp, purpose: dns }
        - { port: 53, protocol: tcp, purpose: dns }
      defaultPortMappings:
        - { hostPort: 5380, containerPort: 5380, protocol: tcp }
        - { hostPort: 53, containerPort: 53, protocol: udp }
        - { hostPort: 53, containerPort: 53, protocol: tcp }
      volumes: [{ name: config, containerPath: /etc/dns, purpose: config, defaultSizeBytes: 1 GB }]
requirements:
  min: { cpu: 0.25, memoryBytes: 256 MiB, diskBytes: 1 GB }
  recommended: { cpu: 1, memoryBytes: 512 MiB, diskBytes: 2 GB }
dependencies: []
provides: [dns]
trafficPatterns:
  - id: web-ui-tcp-5380
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 5380
    purpose: web-ui
    required: true
  - id: dns-udp-53
    direction: inbound
    peer: { kind: lan-clients }
    protocol: udp
    port: 53
    purpose: dns
    required: true
  - id: dns-tcp-53
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 53
    purpose: dns
    required: true
  - id: upstream
    direction: outbound
    peer: { kind: internet }
    protocol: udp
    port: 53
    purpose: dns
    required: true
flows:
  - id: technitium-dns.dns-query
    name: { en: Client DNS query }
    roles:
      - { key: client, name: { en: Client }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Technitium DNS }, selector: { kind: self }, userPicks: false }
      - {
          key: upstream,
          name: { en: Upstream DNS },
          selector: { kind: internet },
          userPicks: false,
        }
    steps:
      - { from: client, to: server, protocol: udp, port: 53 }
      - { from: server, to: upstream, protocol: udp, port: 53 }
  - id: technitium-dns.open-ui
    name: { en: Open Technitium DNS }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Technitium DNS }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
