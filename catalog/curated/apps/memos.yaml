id: memos
name: Memos
description: { en: "Lightweight, privacy-first note taking with a timeline." }
categories: [documents, productivity]
website: "https://usememos.com"
repository: "https://github.com/usememos/memos"
license: MIT
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: memos
      role: app
      image: neosmemo/memos
      defaultTag: stable
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 5230, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 5230, containerPort: 5230, protocol: tcp }]
      volumes:
        [{ name: data, containerPath: /var/opt/memos, purpose: data, defaultSizeBytes: 1 GB }]
requirements:
  min: { cpu: 0.1, memoryBytes: 64 MiB, diskBytes: 500 MiB }
  recommended: { cpu: 0.5, memoryBytes: 256 MiB, diskBytes: 2 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-5230
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 5230
    purpose: web-ui
    required: true
flows:
  - id: memos.open-ui
    name: { en: Open Memos }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Memos }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
