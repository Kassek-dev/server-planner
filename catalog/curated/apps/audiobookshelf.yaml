id: audiobookshelf
name: Audiobookshelf
description: { en: Self-hosted audiobook and podcast server. }
categories: [media]
website: "https://www.audiobookshelf.org"
repository: "https://github.com/advplyr/audiobookshelf"
license: GPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: audiobookshelf
      role: app
      image: ghcr.io/advplyr/audiobookshelf
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 80, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 13378, containerPort: 80, protocol: tcp }]
      volumes:
        - { name: config, containerPath: /config, purpose: config, defaultSizeBytes: 1 GB }
        - { name: metadata, containerPath: /metadata, purpose: data, defaultSizeBytes: 5 GB }
        - { name: audiobooks, containerPath: /audiobooks, purpose: media, defaultSizeBytes: 200 GB }
        - { name: podcasts, containerPath: /podcasts, purpose: media, defaultSizeBytes: 50 GB }
requirements:
  min: { cpu: 0.25, memoryBytes: 256 MiB, diskBytes: 1 GB }
  recommended: { cpu: 1, memoryBytes: 512 MiB, diskBytes: 2 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-80
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 80
    purpose: web-ui
    required: true
flows:
  - id: audiobookshelf.open-ui
    name: { en: Open Audiobookshelf }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Audiobookshelf }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
