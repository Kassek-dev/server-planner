id: mattermost
name: Mattermost
description: { en: "Team messaging with channels, threads and integrations." }
categories: [messaging]
website: "https://mattermost.com"
repository: "https://github.com/mattermost/mattermost"
license: AGPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: stack
  components:
    - key: app
      name: mattermost
      role: app
      image: mattermost/mattermost-team-edition
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 8065, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8065, containerPort: 8065, protocol: tcp }]
      volumes:
        - { name: data, containerPath: /mattermost/data, purpose: data, defaultSizeBytes: 10 GB }
        - {
            name: config,
            containerPath: /mattermost/config,
            purpose: config,
            defaultSizeBytes: 10 MiB,
          }
    - key: db
      name: postgres
      role: database
      image: postgres
      defaultTag: "16"
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 5432, protocol: tcp, purpose: postgresql }]
      volumes:
        - {
            name: pgdata,
            containerPath: /var/lib/postgresql/data,
            purpose: data,
            defaultSizeBytes: 5 GB,
          }
requirements:
  min: { cpu: 1, memoryBytes: 2 GiB, diskBytes: 10 GB }
  recommended: { cpu: 2, memoryBytes: 4 GiB, diskBytes: 50 GB }
dependencies: [{ capability: postgresql, optional: false, providedByComponent: db }]
provides: []
trafficPatterns:
  - id: web-ui-tcp-8065
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 8065
    purpose: web-ui
    required: true
  - id: db-postgresql
    direction: outbound
    peer: { kind: self-component, key: db }
    protocol: tcp
    port: 5432
    purpose: postgresql
    required: true
flows:
  - id: mattermost.open-ui
    name: { en: Open Mattermost }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Mattermost }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
