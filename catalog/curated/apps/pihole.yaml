id: pihole
name: Pi-hole
description: { en: Network-wide ad blocking DNS sinkhole. }
categories: [dns, networking]
website: "https://pi-hole.net"
repository: "https://github.com/pi-hole/pi-hole"
license: EUPL-1.2
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: pihole
      role: dns
      image: pihole/pihole
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners:
        - { port: 53, protocol: udp, purpose: dns }
        - { port: 53, protocol: tcp, purpose: dns }
        - { port: 80, protocol: tcp, purpose: web-ui }
      defaultPortMappings:
        - { hostPort: 53, containerPort: 53, protocol: udp }
        - { hostPort: 53, containerPort: 53, protocol: tcp }
        - { hostPort: 80, containerPort: 80, protocol: tcp }
      volumes:
        [{ name: etc-pihole, containerPath: /etc/pihole, purpose: config, defaultSizeBytes: 1 GB }]
requirements:
  min: { cpu: 0.25, memoryBytes: 256 MiB, diskBytes: 2 GB }
  recommended: { cpu: 1, memoryBytes: 512 MiB, diskBytes: 4 GB }
dependencies: []
provides: [dns]
trafficPatterns:
  - id: dns-udp-53
    direction: inbound
    peer: { kind: lan-clients }
    protocol: udp
    port: 53
    purpose: dns
    required: true
  - id: dns-tcp-53
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 53
    purpose: dns
    required: true
  - id: web-ui-tcp-80
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 80
    purpose: web-ui
    required: true
  - id: upstream
    direction: outbound
    peer: { kind: internet }
    protocol: udp
    port: 53
    purpose: dns
    required: true
  - id: blocklists
    direction: outbound
    peer: { kind: internet }
    protocol: tcp
    port: 443
    purpose: update-check
    required: false
flows:
  - id: pihole.dns-query
    name: { en: Client DNS query }
    roles:
      - { key: client, name: { en: Client }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Pi-hole }, selector: { kind: self }, userPicks: false }
      - {
          key: upstream,
          name: { en: Upstream DNS },
          selector: { kind: internet },
          userPicks: false,
        }
    steps:
      - { from: client, to: server, protocol: udp, port: 53 }
      - { from: server, to: upstream, protocol: udp, port: 53 }
  - id: pihole.open-ui
    name: { en: Open Pi-hole }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Pi-hole }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
