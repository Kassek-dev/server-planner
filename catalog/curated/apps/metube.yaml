id: metube
name: MeTube
description: { en: Web GUI for yt-dlp to download videos from YouTube and other sites. }
categories: [media, downloads]
repository: "https://github.com/alexta69/metube"
license: AGPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: server
      name: metube
      role: app
      image: ghcr.io/alexta69/metube
      defaultTag: latest
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 8081, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 8081, containerPort: 8081, protocol: tcp }]
      volumes:
        [{ name: downloads, containerPath: /downloads, purpose: media, defaultSizeBytes: 100 GB }]
requirements:
  min: { cpu: 0.25, memoryBytes: 128 MiB, diskBytes: 1 GB }
  recommended: { cpu: 1, memoryBytes: 512 MiB, diskBytes: 2 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-8081
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 8081
    purpose: web-ui
    required: true
  - id: sites
    direction: outbound
    peer: { kind: internet }
    protocol: tcp
    port: 443
    purpose: media-stream
    required: true
    bandwidth: { typicalMbps: 20, peakMbps: 200 }
flows:
  - id: metube.open-ui
    name: { en: Open MeTube }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: MeTube }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
