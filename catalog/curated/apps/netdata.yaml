id: netdata
name: Netdata
description: { en: Real-time per-second monitoring of hosts and containers. }
categories: [monitoring]
website: "https://www.netdata.cloud"
repository: "https://github.com/netdata/netdata"
license: GPL-3.0
source: [curated]
confidence: curated
deployment:
  kind: single
  components:
    - key: agent
      name: netdata
      role: app
      image: netdata/netdata
      defaultTag: stable
      arch: [amd64, arm64]
      platform: linux
      listeners: [{ port: 19999, protocol: tcp, purpose: web-ui }]
      defaultPortMappings: [{ hostPort: 19999, containerPort: 19999, protocol: tcp }]
      volumes:
        - { name: lib, containerPath: /var/lib/netdata, purpose: data, defaultSizeBytes: 2 GB }
        - { name: cache, containerPath: /var/cache/netdata, purpose: cache, defaultSizeBytes: 2 GB }
requirements:
  min: { cpu: 0.25, memoryBytes: 256 MiB, diskBytes: 2 GB }
  recommended: { cpu: 1, memoryBytes: 512 MiB, diskBytes: 5 GB }
dependencies: []
provides: []
trafficPatterns:
  - id: web-ui-tcp-19999
    direction: inbound
    peer: { kind: lan-clients }
    protocol: tcp
    port: 19999
    purpose: web-ui
    required: true
flows:
  - id: netdata.open-ui
    name: { en: Open Netdata }
    roles:
      - { key: client, name: { en: Browser }, selector: { kind: lan-clients }, userPicks: true }
      - { key: server, name: { en: Netdata }, selector: { kind: self }, userPicks: false }
    steps: [{ from: client, to: server, protocol: tcp, purpose: web-ui, resolveDns: true }]
