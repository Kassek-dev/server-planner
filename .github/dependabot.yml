version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          [
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom",
            "react-router",
            "react-i18next",
          ]
      tooling:
        patterns:
          ["vite", "@vitejs/*", "typescript", "@biomejs/*", "tailwindcss", "@tailwindcss/*", "tsx"]
      testing:
        patterns: ["vitest", "@playwright/*", "@testing-library/*", "jsdom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
